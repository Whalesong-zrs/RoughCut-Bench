name: code-quality

on:
  push:
  pull_request:

jobs:
  static-and-protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install requests==2.32.5
      - name: Run unit and provider-protocol tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q benchmark_evaluation speech_workflow visual_workflow scripts tests
      - name: Check shell syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
